spring:
  application:
    name: career-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/career_assistant_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:career_user}
    password: ${SPRING_DATASOURCE_PASSWORD:career_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-must-be-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  upload-dir: ${UPLOAD_DIR:./uploads}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}
    base-url: https://generativelanguage.googleapis.com/v1beta
  chroma:
    base-url: ${CHROMA_URL:http://localhost:8000}
    tenant: ${CHROMA_TENANT:default_tenant}
    database: ${CHROMA_DATABASE:default_database}
logging:
  level:
    com.careerassistant: INFO
